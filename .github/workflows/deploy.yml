name: Deploy to cf.count168.site

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Count/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cf
  cancel-in-progress: false

env:
  REMOTE_FRONTEND_DIR: /var/www/cf/Count-Frontend
  REMOTE_BACKEND_DIR: /var/www/cf/Count
  SERVICE: count168-api-cf

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/deploy.yml"
            backend:
              - "Count/**"
              - ".github/workflows/deploy.yml"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload dist
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_FRONTEND_DIR}/"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: maven
      - name: Build jar
        working-directory: Count
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload jar and restart
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          scp -i ~/.ssh/id_deploy Count/target/Count-0.0.1-SNAPSHOT.jar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BACKEND_DIR}/Count-0.0.1-SNAPSHOT.jar.new"
          $SSH "mv ${REMOTE_BACKEND_DIR}/Count-0.0.1-SNAPSHOT.jar.new ${REMOTE_BACKEND_DIR}/Count-0.0.1-SNAPSHOT.jar && sudo systemctl restart ${SERVICE} && sleep 15 && systemctl is-active ${SERVICE}"
