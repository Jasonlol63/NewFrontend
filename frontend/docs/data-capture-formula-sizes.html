<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add Formula Sizes</title>
<style>
  :root { --navy:#14336b; --sub:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#e8eef7; color:#1f2937; }
  h1 { margin:0 0 4px; font-size:20px; color:var(--navy); }
  p.note { margin:0 0 18px; font-size:13px; color:var(--sub); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(620px,1fr)); gap:22px; align-items:start; }
  figure { margin:0; }
  figcaption { margin:0 0 6px; font-size:13px; font-weight:700; color:var(--navy); }
  figcaption span { font-weight:500; color:var(--sub); }
  .box { position:relative; overflow:hidden; border-radius:10px; border:1px solid #c5d3e8; background:#fff; box-shadow:0 6px 18px -10px rgba(20,51,107,.4); }
  .box iframe { position:absolute; top:0; left:0; border:0; transform-origin:0 0; }
</style>
</head>
<body>
<h1>Add Formula at different screen sizes</h1>
<p class="note">Each frame is the real preview page at that browser viewport (CSS px), scaled down to fit. Click inside a frame to use it.</p>
<div class="grid" id="grid"></div>
<script>
  const SIZES = [
    ['1920 × 950', 1920, 950, 'large monitor'],
    ['1600 × 800', 1600, 800, 'common monitor'],
    ['1536 × 730', 1536, 730, '1920 @125% scaling'],
    ['1440 × 760', 1440, 760, 'common monitor'],
    ['1366 × 610', 1366, 610, '1366 laptop'],
    ['1280 × 560', 1280, 560, '1366 laptop, smallest'],
    ['1100 × 700', 1100, 700, 'narrow window (single column)'],
  ];
  const W = 620;   // drawn width of every frame
  document.getElementById('grid').innerHTML = SIZES.map(([label, w, h, note]) => {
    const k = W / w;
    return `<figure><figcaption>${label} <span>· ${note}</span></figcaption>
      <div class="box" style="width:${W}px;height:${Math.round(h * k)}px"><iframe src="data-capture-summary-preview.html#formula" width="${w}" height="${h}" style="transform:scale(${k})" title="${label}"></iframe></div></figure>`;
  }).join('');
</script>
</body>
</html>
