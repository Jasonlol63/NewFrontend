<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin User List</title>
<!--
  Direction for the new Admin (user list) page. Same layout and columns as the old
  Count-Frontend UserListPage, rebuilt with the new app's Tailwind tokens / components:
  the filter rows reuse the Dashboard SegmentGroup look, cards use the same white card +
  soft shadow, the table header uses the brand gradient. Mock data only.
-->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style type="text/tailwindcss">
  /* same tokens as frontend/src/index.css */
  @theme {
    --font-sans: 'Geist', system-ui, sans-serif;
    --color-dash-ink: #111827;
    --color-dash-sub: #6b7280;
    --color-dash-faint: #9ca3af;
    --color-dash-line: #e5e7eb;
    --shadow-dash-card: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-dash-filter: 0 2px 8px rgba(15, 23, 42, 0.08);
  }
  @utility bg-seg-active { background-image: linear-gradient(180deg, #63c4ff 0%, #0d60ff 100%); }
  @utility bg-brand-head { background-image: linear-gradient(180deg, #60c1fe 0%, #0f61ff 100%); }
  @layer base { body { @apply font-sans text-dash-ink antialiased; } }

  .seg button { @apply flex-none cursor-pointer border-r border-dash-line bg-white px-4 py-1.5 text-[12.5px] font-semibold whitespace-nowrap text-[#1f2937] transition-colors last:border-r-0 hover:bg-slate-50; }
  .seg button.is-active { @apply bg-seg-active text-white; }

  /* old user-filter-chip, carried over: grey pill, round dot that fills with a blue tick when on */
  .chip { @apply inline-flex min-w-[108px] cursor-pointer items-center gap-2 rounded-full border border-dash-line bg-[#f8fafc] py-1 pr-3 pl-1 text-[13px] font-medium text-[#475569] shadow-[0_1px_2px_rgba(15,23,42,0.05)] transition-[border-color,box-shadow,color] hover:border-[#cbd5e1] hover:shadow-[0_2px_4px_rgba(15,23,42,0.08)]; }
  .chip .dot { @apply flex size-[18px] flex-none items-center justify-center rounded-full bg-[#e2e8f0] text-white transition-colors; }
  .chip .dot svg { @apply hidden size-[11px]; }
  .chip.is-on { @apply border-[rgba(13,96,255,0.45)] text-[#0d60ff] shadow-[0_2px_6px_rgba(13,96,255,0.12)]; }
  .chip.is-on .dot { @apply bg-seg-active; }
  .chip.is-on .dot svg { @apply block; }
</style>
</head>
<body class="bg-[#eaf3fd]">
<div class="flex min-h-screen bg-[linear-gradient(200deg,#eaf3fd_0%,#cfe3fb_55%,#bcd8f7_100%)]">
  <!-- existing Sidebar.jsx, stubbed for proportions -->
  <aside class="hidden w-[234px] flex-none bg-[linear-gradient(160deg,#123064_0%,#0c2452_45%,#061225_100%)] p-4 text-[13px] font-bold text-white/80 lg:block">
    <div class="mb-6 text-sm tracking-wide text-white">EAZYCOUNT</div>
    <div class="px-3 py-2.5">1. Home</div>
    <div class="rounded-xl bg-[linear-gradient(100deg,#0a3fc9_0%,#2f8dff_55%,#3fc4ff_100%)] px-3 py-2.5 text-white">2. Admin</div>
    <div class="px-3 py-2.5">3. Account</div><div class="px-3 py-2.5">…</div>
  </aside>

  <!-- → pages/admin/AdminPage.jsx -->
  <main class="flex min-w-0 flex-1 flex-col gap-3 p-4">

    <!-- ===== → components/UserToolbar.jsx : actions + search + status filter + Group/Company ===== -->
    <section class="rounded-xl border border-dash-line bg-white shadow-dash-filter">
      <div class="flex flex-wrap items-center gap-2.5 border-b border-dash-line px-4 py-2.5">
        <button class="bg-seg-active inline-flex cursor-pointer items-center gap-1.5 rounded-[10px] px-4 py-2 text-[13px] font-bold text-white shadow-[0_6px_14px_-6px_rgba(13,96,255,0.6)]">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>
          Add User
        </button>

        <label class="flex h-9 w-[260px] items-center gap-2 rounded-[10px] border border-dash-line bg-white px-3 text-[13px] shadow-[0_1px_3px_rgba(15,23,42,0.05)] focus-within:border-[#3b82f6]">
          <svg class="size-4 flex-none text-dash-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" class="w-full bg-transparent outline-none placeholder:text-dash-faint" placeholder="Search Login ID, Name, Email">
        </label>

        <!-- → components/FilterChip.jsx : three independent toggles, same as the old page -->
        <div class="flex items-center gap-2" id="chips">
          <button type="button" class="chip" data-chip="showAll" aria-pressed="false"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l4 4 8-8"/></svg></span>Show All</button>
          <button type="button" class="chip" data-chip="showActive" aria-pressed="false"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l4 4 8-8"/></svg></span>Show Active</button>
          <button type="button" class="chip" data-chip="showInactive" aria-pressed="false"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l4 4 8-8"/></svg></span>Show Inactive</button>
        </div>

        <button id="delBtn" disabled
          class="ml-auto inline-flex items-center gap-1.5 rounded-[10px] px-4 py-2 text-[13px] font-bold text-white transition-colors enabled:cursor-pointer enabled:bg-[linear-gradient(180deg,#ff8a8a_0%,#ef4444_100%)] enabled:shadow-[0_6px_14px_-6px_rgba(239,68,68,0.6)] disabled:bg-slate-300">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          Delete (<span id="delCount">0</span>)
        </button>
      </div>

      <div class="flex flex-col gap-2 px-4 py-2.5">
        <div class="flex items-center gap-2">
          <span class="w-[84px] flex-none text-[13px] font-bold text-[#1f2937]">Group ID:</span>
          <div class="seg inline-flex overflow-hidden rounded-[10px] border border-dash-line bg-white shadow-[0_1px_3px_rgba(15,23,42,0.05)]">
            <button>AP</button><button class="is-active">IG</button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-[84px] flex-none text-[13px] font-bold text-[#1f2937]">Company:</span>
          <div class="seg inline-flex overflow-hidden rounded-[10px] border border-dash-line bg-white shadow-[0_1px_3px_rgba(15,23,42,0.05)]">
            <button class="is-active">95</button><button>AG</button><button>CX</button><button>RS</button><button>VG</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== → components/UserTable.jsx ===== -->
    <section class="overflow-hidden rounded-xl border border-dash-line bg-white shadow-dash-card">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[980px] border-separate border-spacing-0 text-[13px]">
          <thead>
            <tr class="bg-brand-head text-left text-[13px] font-bold text-white" id="thead"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between border-t border-dash-line px-4 py-2.5 text-[12px] text-dash-sub">
        <span id="summary"></span>
        <div class="flex items-center gap-1" id="pager"></div>
      </div>
    </section>
  </main>
</div>

<script>
const USERS = [
  { login: 'APPLE', name: 'APPLE', email: 'allbet95csd@gmail.com', role: 'Manager', status: 'active', lastLogin: '30-09-2026', lastLogout: '30-09-2026', createdBy: 'ZERO' },
  { login: 'BEE', name: 'BEE', email: 'rsbee85@gmail.com', role: 'Admin', status: 'active', lastLogin: '28-09-2026', lastLogout: '-', createdBy: 'K' },
  { login: 'JK', name: 'JK', email: 'maxjk77777@gmail.com', role: 'Partnership', status: 'active', lastLogin: '30-09-2026', lastLogout: '-', createdBy: 'K' },
  { login: 'MOON', name: 'MOON', email: 'mmoon@gmail.com', role: 'Supervisor', status: 'active', lastLogin: '29-09-2026', lastLogout: '-', createdBy: 'ZERO' },
  { login: 'ZERO', name: 'ZERO', email: 'kunzzz999@gmail.com', role: 'Admin', status: 'active', lastLogin: '29-09-2026', lastLogout: '-', createdBy: 'K' },
  { login: 'RIVER', name: 'RIVER', email: 'river.acc@gmail.com', role: 'Accountant', status: 'inactive', lastLogin: '12-08-2026', lastLogout: '12-08-2026', createdBy: 'K' },
  { login: 'SKY', name: 'SKY', email: 'sky.audit@gmail.com', role: 'Audit', status: 'inactive', lastLogin: '02-07-2026', lastLogout: '-', createdBy: 'ZERO' },
];

// colours carried over 1:1 from the old userlist.css role / status badges
const ROLE = {
  admin: 'bg-[#ffe0e0] text-[#a30b0b] border-[#ffa8a8]',
  manager: 'bg-[#ffe5cc] text-[#a24700] border-[#ffc58c]',
  supervisor: 'bg-[#dff4e7] text-[#0f6d38] border-[#bbe9cf]',
  accountant: 'bg-[#dfe3ff] text-[#14228a] border-[#bfc7ff]',
  audit: 'bg-[#f0e1ff] text-[#4f148f] border-[#ddbdfd]',
  'customer service': 'bg-[#eceef2] text-[#3e434f] border-[#d6d9e1]',
  owner: 'bg-[#f2dfd2] text-[#5f2e0f] border-[#dbb99a]',
  partnership: 'bg-[#d0cbfc] text-[#120b9d] border-[#b8b3ff]',
};
const STATUS = {
  active: 'bg-[#dcfce7] text-[#15803d] border-[#bbf7d0]',
  inactive: 'bg-[#fee2e2] text-[#b91c1c] border-[#fecaca]',
};
const COLS = [
  { key: 'no', label: 'No', w: 'w-[56px]', sort: false },
  { key: 'login', label: 'Login ID' },
  { key: 'name', label: 'Name' },
  { key: 'email', label: 'Email' },
  { key: 'role', label: 'Role' },
  { key: 'status', label: 'Status' },
  { key: 'lastLogin', label: 'Last Login' },
  { key: 'lastLogout', label: 'Last Logout' },
  { key: 'createdBy', label: 'Created By' },
  { key: 'action', label: 'Action', sort: false, align: 'text-center' },
  { key: 'select', label: '', sort: false, w: 'w-[44px]' },
];

// showAll: no pagination. showActive / showInactive: neither → active only, inactive only →
// inactive only, both → everyone (old userListLogic.js rules).
const PAGE_SIZE = 4;
const state = { showAll: false, showActive: false, showInactive: false, page: 1, q: '', sortKey: null, dir: 1, selected: new Set() };
const sortIcon = (k) => {
  const on = state.sortKey === k;
  return `<span class="ml-1 inline-flex flex-col leading-[5px] text-[8px] ${on ? 'opacity-100' : 'opacity-55'}">
    <span class="${on && state.dir === 1 ? '' : 'opacity-40'}">▲</span><span class="${on && state.dir === -1 ? '' : 'opacity-40'}">▼</span></span>`;
};

function rows() {
  let list = USERS.filter((u) => (state.showActive && state.showInactive) || u.status === (state.showInactive ? 'inactive' : 'active'));
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter((u) => [u.login, u.name, u.email].some((v) => v.toLowerCase().includes(q)));
  if (state.sortKey) list = [...list].sort((a, b) => String(a[state.sortKey]).localeCompare(String(b[state.sortKey])) * state.dir);
  return list;
}

function render() {
  const all = rows();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  state.page = Math.min(state.page, pages);
  const list = state.showAll ? all : all.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
  const offset = state.showAll ? 0 : (state.page - 1) * PAGE_SIZE;
  document.getElementById('thead').innerHTML = COLS.map((c, i) => {
    const first = i === 0 ? 'pl-4' : '', last = i === COLS.length - 1 ? 'pr-4' : '';
    if (c.key === 'select') {
      const all = list.length && list.every((u) => state.selected.has(u.login));
      return `<th class="${c.w} py-2.5 ${last}"><input type="checkbox" data-all ${all ? 'checked' : ''} class="size-4 cursor-pointer accent-white"></th>`;
    }
    return `<th class="${c.w || ''} py-2.5 pr-3 ${first} ${c.align || ''} whitespace-nowrap ${c.sort === false ? '' : 'cursor-pointer select-none'}" ${c.sort === false ? '' : `data-sort="${c.key}"`}>
      <span class="inline-flex items-center">${c.label}${c.sort === false ? '' : sortIcon(c.key)}</span></th>`;
  }).join('');

  document.getElementById('tbody').innerHTML = list.length ? list.map((u, i) => {
    const sel = state.selected.has(u.login);
    const td = 'py-2 pr-3 border-b border-[#eef2f7]';
    return `<tr class="${sel ? 'bg-[#dbeafe]' : i % 2 ? 'bg-white' : 'bg-[#f3f8ff]'} transition-colors hover:bg-[#e8f1ff]">
      <td class="${td} pl-4 text-dash-sub tabular-nums">${offset + i + 1}</td>
      <td class="${td} font-semibold">${u.login}</td>
      <td class="${td}">${u.name}</td>
      <td class="${td} text-[#374151]">${u.email}</td>
      <td class="${td}"><span class="inline-flex rounded-md border px-2 py-0.5 text-[11px] font-bold tracking-wide uppercase ${ROLE[u.role.toLowerCase()]}">${u.role}</span></td>
      <td class="${td}"><button data-toggle="${u.login}" title="Click to change status" class="inline-flex cursor-pointer rounded-md border px-2 py-0.5 text-[11px] font-bold tracking-wide uppercase transition-opacity hover:opacity-80 ${STATUS[u.status]}">${u.status}</button></td>
      <td class="${td} tabular-nums">${u.lastLogin}</td>
      <td class="${td} tabular-nums text-[#374151]">${u.lastLogout}</td>
      <td class="${td}">${u.createdBy}</td>
      <td class="${td} text-center">
        <button class="inline-flex size-7 cursor-pointer items-center justify-center rounded-lg text-[#2563eb] transition-colors hover:bg-[#e8f1ff]" title="Edit">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button></td>
      <td class="${td} pr-4"><input type="checkbox" data-sel="${u.login}" ${sel ? 'checked' : ''} class="size-4 cursor-pointer accent-[#2563eb]"></td>
    </tr>`;
  }).join('') : `<tr><td colspan="${COLS.length}" class="py-10 text-center text-dash-faint">No users found</td></tr>`;

  document.getElementById('summary').textContent = state.showAll ? `Showing all ${all.length} users` : `Showing ${list.length ? offset + 1 : 0}–${offset + list.length} of ${all.length} users`;
  document.getElementById('pager').innerHTML = state.showAll ? '' : pagerHtml(pages);
  const n = state.selected.size;
  document.getElementById('delCount').textContent = n;
  document.getElementById('delBtn').disabled = n === 0;
}

function pagerHtml(pages) {
  const btn = 'flex size-7 cursor-pointer items-center justify-center rounded-lg border border-dash-line bg-white hover:bg-slate-50 disabled:cursor-default disabled:opacity-40';
  let h = `<button data-page="${state.page - 1}" class="${btn}" ${state.page === 1 ? 'disabled' : ''}>‹</button>`;
  for (let n = 1; n <= pages; n++) h += n === state.page
    ? `<button class="bg-seg-active flex size-7 items-center justify-center rounded-lg font-bold text-white">${n}</button>`
    : `<button data-page="${n}" class="${btn}">${n}</button>`;
  return h + `<button data-page="${state.page + 1}" class="${btn}" ${state.page === pages ? 'disabled' : ''}>›</button>`;
}
document.getElementById('pager').addEventListener('click', (e) => {
  const p = e.target.closest('[data-page]'); if (!p || p.disabled) return; state.page = +p.dataset.page; render();
});
document.getElementById('chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-chip]'); if (!c) return;
  const k = c.dataset.chip; state[k] = !state[k]; state.page = 1;
  c.classList.toggle('is-on', state[k]); c.setAttribute('aria-pressed', state[k]);
  render();
});
document.getElementById('thead').addEventListener('click', (e) => {
  const th = e.target.closest('[data-sort]');
  if (th) { const k = th.dataset.sort; state.dir = state.sortKey === k ? -state.dir : 1; state.sortKey = k; render(); }
});
document.getElementById('thead').addEventListener('change', (e) => {
  if (!e.target.matches('[data-all]')) return;
  rows().forEach((u) => (e.target.checked ? state.selected.add(u.login) : state.selected.delete(u.login)));
  render();
});
document.getElementById('tbody').addEventListener('change', (e) => {
  const id = e.target.dataset.sel; if (!id) return;
  e.target.checked ? state.selected.add(id) : state.selected.delete(id); render();
});
document.getElementById('tbody').addEventListener('click', (e) => {
  const id = e.target.closest('[data-toggle]')?.dataset.toggle; if (!id) return;
  const u = USERS.find((x) => x.login === id); u.status = u.status === 'active' ? 'inactive' : 'active'; render();
});
document.getElementById('search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach((x) => x.classList.remove('is-active')); b.classList.add('is-active');
}));
render();
</script>
</body>
</html>
