<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account Form Sizes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 24px 40px; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #0f172a; background: #dfe7f3; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: #14336b; }
  .sub { margin: 0 0 14px; font-size: 13px; color: #475569; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 0 14px; background: #dfe7f3; font-size: 12.5px; font-weight: 700; color: #475569; }
  .bar button { border: 1px solid #c7d4e8; background: #fff; color: #334155; border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; }
  .bar button.on { background: #14336b; border-color: #14336b; color: #fff; }
  .bar .gap { width: 10px; }
  .grid { max-width: 1400px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.08); width: fit-content; }
  .tabs button { border: none; background: transparent; border-radius: 9px; padding: 8px 14px; font: inherit; cursor: pointer; text-align: left; color: #334155; }
  .tabs button b { display: block; font-size: 13.5px; font-weight: 800; }
  .tabs button span { display: block; font-size: 11px; font-weight: 600; color: #64748b; }
  .tabs button.on { background: linear-gradient(135deg, #3fc4ff 0%, #1d7bff 45%, #0a3fc9 100%); color: #fff; box-shadow: 0 4px 10px -4px rgba(20,90,220,.6); }
  .tabs button.on span { color: rgba(255,255,255,.85); }
  .shot h2 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 800; }
  .shot h2 span { font-size: 12px; font-weight: 600; color: #64748b; }
  .frame { position: relative; overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 10px 30px -18px rgba(15,23,42,.5), 0 0 0 1px rgba(15,23,42,.08); }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
  textarea { display: none; }
</style>
</head>
<body>
  <h1>Add / Edit Account · C1 at every screen size (desktop + tablet)</h1>
  <p class="sub">The six desktop sizes from CLAUDE.md plus four tablet sizes. Pick a size tab, then a state. Each size is rendered at its real CSS size and scaled down to fit this window.</p>
  <div class="tabs" id="tabs"></div>
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
<textarea id="src"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account Form C1</title>
<style>
  :root {
    --navy: #14336b;
    --sweep: linear-gradient(135deg, #3fc4ff 0%, #1d7bff 45%, #0a3fc9 100%);
    --modal-bg: rgba(222, 232, 246, 0.62);
    --card: rgba(255, 255, 255, 0.42);
    --line: rgba(255, 255, 255, 0.7);
    --divider: rgba(130, 155, 195, 0.22);
    --input: rgba(255, 255, 255, 0.62);
    --input-line: rgba(130, 155, 195, 0.38);
    --off: rgba(255, 255, 255, 0.5);
    --off-line: rgba(130, 155, 195, 0.3);
    --stripe: linear-gradient(180deg, #eaf3ff, #dcebff);
    --faint: #9ca3af;
    --red: #ef4444;
    --btn-shadow: 0 10px 20px -8px rgba(20,90,220,.55), inset 0 -3px 8px rgba(0,0,0,.08), inset 0 2px 4px rgba(255,255,255,.35);
    --sel-shadow: 0 4px 10px -4px rgba(20,90,220,.6);

    /* Size tokens. Tall screens use these; the height tiers below shrink them
       (same breakpoints as the app: modal-compact <= 760px, modal-tiny <= 600px). */
    --m: 16px;          /* modal margin */
    --pad: 18px;        /* body padding */
    --gap: 14px;        /* gap between cards */
    --cp: 16px;         /* card padding */
    --ch: 50px;         /* card header height */
    --in: 36px;         /* input height */
    --fg: 12px;         /* gap between fields */
    --lbl: 12.5px;
    --pick: 40px;       /* quick pick height */
    --day: 28px;        /* custom day cell */
    --tile: 40px;       /* currency tile */
    --title: 26px;
    --hicon: 40px;
    --btn: 38px;
    --mday: 27px;       /* custom day cell (compact grid): height / min width */
    --mday-w: 40px;
    --bell: 22px;       /* bell badge in the reminder summary */
    --k: 1;             /* text scale: every font size in the modal is written as N px × --k (never under 10px) */
  }
  @media (max-height: 760px), (max-width: 1100px) {
    :root { --m: 10px; --pad: 12px; --gap: 10px; --cp: 12px; --ch: 42px; --in: 32px; --fg: 9px; --lbl: 12px;
      --pick: 36px; --day: 27px; --tile: 36px; --title: 21px; --hicon: 32px; --btn: 32px; --k: .96; --mday: 26px; --mday-w: 38px; --bell: 21px; }
  }
  @media (max-height: 640px) {
    :root { --fg: 8px; --day: 25px; --tile: 34px; --pick: 32px; --ch: 40px; --in: 30px; --mday: 24px; --mday-w: 36px; }
  }
  @media (max-height: 600px) {
    :root { --m: 8px; --pad: 10px; --gap: 8px; --cp: 10px; --ch: 38px; --in: 30px; --fg: 7px; --lbl: 11.5px;
      --pick: 32px; --day: 24px; --tile: 32px; --title: 19px; --hicon: 28px; --btn: 30px; --k: .92; --mday: 23px; --mday-w: 34px; --bell: 19px; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #eaf1fb; color: #111827; }
  body { display: flex; overflow: hidden; }
  svg { display: block; flex: none; }
  p { margin: 0; }
  button { font-family: inherit; }

  /* ---- page behind (real widths: Sidebar clamp(220px,15.5vw,236px) >= 1200px, icon rail 64px below) ---- */
  .sidebar { width: clamp(220px, 15.5vw, 236px); flex: none; background: linear-gradient(180deg, #0b2a5b, #0a1f45); color: #cbd5e1; padding: 18px 12px; font-size: 13px; font-weight: 600; overflow: hidden; }
  .sidebar .logo { color: #fff; font-weight: 800; letter-spacing: 1px; margin: 0 8px 22px; white-space: nowrap; }
  .sidebar div.item { padding: 8px 12px; border-radius: 10px; margin-bottom: 2px; white-space: nowrap; }
  .sidebar div.item.on { background: var(--sweep); color: #fff; }
  @media (max-width: 1199px) {
    .sidebar { width: 64px; padding: 14px 10px; }
    .sidebar .logo, .sidebar div.item { font-size: 0; height: 36px; margin: 0 0 8px; padding: 0; }
    .sidebar .logo { height: 40px; border-radius: 99px; background: rgba(255,255,255,.12); }
    .sidebar div.item { background: rgba(255,255,255,.06); }
  }
  .main { position: relative; flex: 1; min-width: 0; padding: 16px; overflow: hidden; }
  .fake-toolbar { height: 52px; border-radius: 14px; background: #fff; margin-bottom: 12px; }
  .fake-row { height: 30px; border-radius: 6px; background: #fff; margin-bottom: 4px; }
  .fake-row:nth-child(odd) { background: #eef5ff; }

  /* ---- modal shell ---- */
  .overlay { position: absolute; inset: 0; display: flex; }
  .scrim { position: absolute; inset: 0; background: rgba(214,230,252,.72); backdrop-filter: blur(12px); }
  .modal { position: relative; z-index: 1; margin: var(--m); flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
    border-radius: 22px; background: var(--modal-bg); backdrop-filter: blur(22px) saturate(1.15); box-shadow: 0 30px 60px -30px rgba(20,51,107,.35); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(var(--pad) + 2px) calc(var(--pad) + 6px) 0; flex: none; }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .hicon { width: var(--hicon); height: var(--hicon); border-radius: 12px; background: var(--sweep); color: #fff; display: grid; place-items: center; box-shadow: var(--btn-shadow); flex: none; }
  h1 { margin: 0; font-size: var(--title); font-weight: 800; letter-spacing: -.3px; color: var(--navy); white-space: nowrap; }
  .soft { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--btn) - 2px); padding: 0 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55); color: var(--navy); font-size: calc(13px * var(--k)); font-weight: 700; cursor: pointer; flex: none; }

  /* Two columns; the cards never push the modal past the screen: each one scrolls inside itself. */
  /* 2 columns below 1440px: the left one (Account Information + Currency) is a little wider. */
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--gap); padding: var(--gap) var(--pad); }
  /* Screens >= 1440px wide: three equal columns, Company gets its own box so nothing stretches. */
  .body.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* Swap (Payment Alert under Account Information): the left column holds two cards, so it gets more width. */
  .body.swap:not(.wide) { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  /* With Company in its own box, Account Information has room for 2 fields per row (ID | Name, Role | Password, Remark). */
  .body.wide .info .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .body.wide .info .remark { grid-column: 1 / -1; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; min-width: 0; }
  .card { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 8px 24px -18px rgba(20,51,107,.4); }
  .card.info { flex: 0 1 auto; }
  .card.cur { flex: 1 1 auto; min-height: min(150px, 30%); }
  .card.alert { flex: 1 1 auto; }
  /* Swap: Account Information always shows in full (no fields hidden behind a scroll);
     Payment Alert takes what is left and scrolls inside itself only on short screens. */
  .body.swap .card.info { flex: none; }
  .body.swap .card.alert { min-height: 140px; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 0 var(--cp); height: var(--ch); border-bottom: 1px solid var(--divider); flex: none; }
  .card-h .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .bar { width: 4px; height: 16px; border-radius: 2px; background: linear-gradient(180deg, #3fc4ff, #0a3fc9); flex: none; }
  h2 { margin: 0; font-size: calc(15px * var(--k)); font-weight: 800; color: var(--navy); white-space: nowrap; }
  .count { font-size: max(10px, calc(11px * var(--k))); font-weight: 700; color: #3b82f6; white-space: nowrap; }
  .card-b { flex: 1; min-height: 0; overflow-y: auto; padding: var(--cp); scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--fg) 14px; }
  .full { grid-column: 1 / -1; }
  /* Account Information is always 3 columns (ID | Name | Role, Password | Remark, Company): short boxes, one layout on every screen. */
  .info .grid2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .info .remark { grid-column: span 2; }
  /* Short screens: Account Information goes to 3 columns (ID | Name | Role, Password | Remark, Company) to save a row. */
  .f { min-width: 0; }
  .f .l { display: block; margin: 0 0 4px 2px; font-size: var(--lbl); font-weight: 600; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f i { font-style: normal; color: var(--red); }
  .f em { font-style: normal; font-size: max(10px, calc(10px * var(--k))); font-weight: 500; color: #8a96a8; }
  .in { height: var(--in); width: 100%; min-width: 0; border-radius: 10px; border: 1px solid var(--input-line); background: var(--input); padding: 0 12px; font-size: calc(13.5px * var(--k)); font-family: inherit;
    box-shadow: 0 1px 3px rgba(15,23,42,.05); display: flex; align-items: center; gap: 8px; color: #111827; outline: none; white-space: nowrap; overflow: hidden; }
  .in.ph { color: var(--faint); }
  .in .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { margin: 4px 0 0 2px; font-size: max(10px, calc(11px * var(--k))); color: #8a96a8; }

  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: calc(12px * var(--k)); font-weight: 700; color: #475569; cursor: pointer; }
  .track { position: relative; width: 34px; height: 19px; border-radius: 99px; background: #cbd5e1; transition: background .2s; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
  .switch.on .track { background: var(--sweep); }
  .switch.on .track::after { left: 17px; }

  /* ---- Company field ---- */
  .multi { min-height: var(--in); height: auto; flex-wrap: wrap; padding: 3px 64px 3px 5px; gap: 4px; cursor: pointer; position: relative; }
  .multi:hover { border-color: #93c5fd; }
  .multi.open { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .tok { height: calc(var(--in) - 10px); display: inline-flex; align-items: center; gap: 6px; padding: 0 5px 0 10px; border-radius: 7px; background: var(--stripe); border: 1px solid #7fb2ff; font-size: calc(12px * var(--k)); font-weight: 800; color: var(--navy); }
  .tok .rm { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; color: #64748b; }
  .tok .rm:hover { background: rgba(255,255,255,.9); color: var(--red); }
  .multi .ph { color: var(--faint); padding-left: 6px; font-size: calc(13.5px * var(--k)); }
  .multi .meta { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; font-size: max(10px, calc(11px * var(--k))); font-weight: 700; color: #8a96a8; }
  .multi.open .meta svg { transform: rotate(180deg); }

  /* ---- popups: rendered on top of everything (like a Radix portal), so no card can cover or clip them ---- */
  .portal { position: fixed; z-index: 100; border-radius: 12px; border: 1px solid #e5e7eb; background: #fff; box-shadow: 0 12px 32px -8px rgba(15,23,42,.25); overflow: hidden; }
  .pop { display: flex; flex-direction: column; }
  .pop-h { display: flex; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid #eef2f7; flex: none; }
  .mini-search { flex: 1; min-width: 0; height: 32px; border-radius: 9px; border: 1px solid #e5e7eb; background: #f8fafc; display: flex; align-items: center; gap: 6px; padding: 0 9px; font-size: calc(12.5px * var(--k)); color: var(--faint); }
  .mini-search input { border: none; outline: none; background: transparent; width: 100%; font: inherit; color: #111827; }
  .lnk { border: none; background: transparent; padding: 4px 6px; border-radius: 6px; font-size: calc(12px * var(--k)); font-weight: 700; color: #1d7bff; cursor: pointer; white-space: nowrap; }
  .lnk:hover { background: #eef4ff; }
  .lnk.mute { color: #64748b; }
  .opts { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 6px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid transparent; font-size: calc(13px * var(--k)); cursor: pointer; flex: none; }
  .opt:hover { background: #f4f8fe; }
  .opt.on { background: var(--stripe); border-color: #bfd8ff; }
  .opt .box { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid #cbd5e1; background: #fff; display: grid; place-items: center; flex: none; }
  .opt.on .box { border: none; background: var(--sweep); }
  .opt b { width: 72px; flex: none; color: #374151; font-weight: 800; }
  .opt.on b { color: var(--navy); }
  .opt .nm { color: #64748b; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .tag { flex: none; font-size: max(10px, calc(10px * var(--k))); font-weight: 800; letter-spacing: .4px; color: #1d4ed8; background: #dbeafe; border-radius: 5px; padding: 2px 6px; }
  .opt-empty { padding: 14px; text-align: center; font-size: calc(12px * var(--k)); color: #8a96a8; }
  .pop-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px 7px 14px; border-top: 1px solid #eef2f7; background: #fafcff; font-size: calc(12px * var(--k)); color: #64748b; font-weight: 600; flex: none; }
  .pop-f b { color: var(--navy); }
  .done { height: 28px; padding: 0 16px; border: none; border-radius: 8px; background: var(--sweep); color: #fff; font-size: calc(12.5px * var(--k)); font-weight: 700; cursor: pointer; box-shadow: var(--sel-shadow); }

  /* ---- Currency ---- */
  .cur-tools { display: flex; gap: 8px; align-items: center; }
  /* Code box + Create + Delete always on one row; the box only needs room for a short code, so it doesn't stretch across the card. */
  .cur-tools .in { flex: 1 1 auto; width: auto; min-width: 72px; max-width: 220px; text-transform: uppercase; }
  .btn { height: var(--in); display: inline-flex; align-items: center; gap: 6px; padding: 0 13px; border-radius: 10px; font-size: calc(12.5px * var(--k)); font-weight: 700; cursor: pointer; white-space: nowrap; flex: none; }
  .btn.blue { border: none; background: var(--sweep); color: #fff; box-shadow: var(--btn-shadow); }
  .btn.del { border: 1px solid #fecaca; background: rgba(255,255,255,.7); color: #dc2626; }
  .btn.del.on { background: #dc2626; border-color: #dc2626; color: #fff; }
  .ctiles { margin-top: var(--fg); display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; max-width: 700px; }
  .ctile { position: relative; display: flex; align-items: center; height: var(--tile); padding: 0 32px 0 14px; border-radius: 11px; border: 1px solid var(--off-line); background: rgba(255,255,255,.6); cursor: pointer; font-size: calc(13px * var(--k)); font-weight: 800; color: #374151; }
  .ctile:hover { border-color: #93c5fd; }
  .ctile .k { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 99px; border: 1.5px solid #cbd5e1; display: grid; place-items: center; }
  .ctile .x { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: none; color: var(--red); }
  .ctile.on { border-color: #7fb2ff; background: var(--stripe); color: var(--navy); }
  .ctile.on .k { border: none; background: var(--sweep); }
  .deleting .ctile:not(.on) { border-color: #fecaca; background: #fff; color: #b91c1c; }
  .deleting .ctile:not(.on) .k { display: none; }
  .deleting .ctile:not(.on) .x { display: block; }
  .deleting .ctile.on { opacity: .45; cursor: not-allowed; }
  .del-hint { margin-top: 8px; font-size: max(10px, calc(11.5px * var(--k))); color: #b91c1c; }

  /* ---- Payment Alert ---- */
  .off-state { height: 100%; min-height: 80px; display: grid; place-items: center; text-align: center; color: #8a96a8; font-size: calc(12.5px * var(--k)); border: 1px dashed var(--off-line); border-radius: 12px; padding: 10px; }
  /* Company box (large screens) */
  .card.co { flex: 1 1 auto; }
  .co-tools { display: flex; align-items: center; gap: 6px; flex: none; padding: 10px var(--cp); border-bottom: 1px solid var(--divider); }
  .co-tools .mini-search { background: var(--input); border-color: var(--input-line); }
  .card.co .opts { padding: 8px; }
  .card.co .opt { min-height: var(--in); background: rgba(255,255,255,.35); border-color: rgba(255,255,255,.55); }
  .card.co .opt:hover { background: rgba(255,255,255,.75); }
  .card.co .opt.on { background: var(--stripe); border-color: #bfd8ff; }
  .picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .pick { height: var(--pick); min-width: 0; border-radius: 11px; border: 1px solid var(--off-line); background: var(--off); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 4px; }
  .pick b { font-size: calc(13px * var(--k)); font-weight: 800; color: #374151; white-space: nowrap; }
  .pick span { font-size: max(10px, calc(10.5px * var(--k))); font-weight: 600; color: #8a96a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .pick:hover { border-color: #93c5fd; background: rgba(255,255,255,.85); }
  .pick.on { border-color: #3b82f6; background: var(--stripe); box-shadow: inset 0 0 0 1px #3b82f6; }
  .pick.on b { color: #0d4fd6; }
  .pick.on span { color: #3b82f6; }
  .pcustom { margin-top: 8px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--off-line); background: rgba(255,255,255,.3); }
  .pcustom-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: calc(12px * var(--k)); font-weight: 700; color: #475569; }
  .pcustom-h small { font-weight: 500; color: #8a96a8; }
  .pdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 62px; gap: 4px; align-items: center; }
  .pdays b { height: var(--day); display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--off-line); background: var(--off); font-size: calc(12.5px * var(--k)); font-weight: 600; color: #475569; cursor: pointer; }
  .pdays b:hover { border-color: #93c5fd; background: rgba(255,255,255,.85); }
  .pdays b.on { border-color: #3b82f6; background: var(--stripe); color: #0d4fd6; font-weight: 800; box-shadow: inset 0 0 0 1px #3b82f6; }
  .pdays b.gap { visibility: hidden; }
  .pdays .wk { font-size: max(10px, calc(10.5px * var(--k))); font-weight: 700; color: #8a96a8; padding-left: 4px; white-space: nowrap; }
  .mode-note { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; font-size: calc(12px * var(--k)); color: #475569; line-height: 1.45; }
  .mode-note svg { color: #3b82f6; margin-top: 2px; }
  .mode-note b { color: var(--navy); }
  .summary { margin-top: var(--fg); padding: 9px 12px; border-radius: 10px; background: var(--stripe); border: 1px solid #bfd8ff; font-size: calc(12.5px * var(--k)); color: var(--navy); font-weight: 600; }
  .summary .top { display: flex; align-items: center; gap: 8px; }
  /* Wide enough: the sentence and the next dates share one line; otherwise the dates wrap under it. */
  .summary:has(.pdates) { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .summary:has(.pdates) .pdates { margin-top: 0; }
  .summary svg { color: #1d7bff; }
  .pdates { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .pdates span { height: 22px; padding: 0 8px; border-radius: 7px; background: rgba(255,255,255,.75); font-size: max(10px, calc(11.5px * var(--k))); font-weight: 700; color: #334155; display: inline-flex; align-items: center; }
  .pdates span.adj { background: #fff7e6; color: #92560a; }
  @media (max-height: 640px) {
    .summary { padding: 6px 10px; }
    .summary .pdates { margin-top: 4px; }
    .pdates span { height: 20px; }
  }
  /* Very short screens: 4 upcoming dates instead of 5, so the summary fits on one line. */
  @media (max-height: 600px) { .summary .pdates span:nth-child(5) { display: none; } }

  /* ---- Start Date + calendar popup (Dashboard calendar, single day, app gradient) ---- */
  .dp-in { cursor: pointer; }
  .dp-in:hover { border-color: #93c5fd; }
  .dp-in.open { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .dp-pop { padding: 10px; overflow-y: auto; }
  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dp-nav { width: 24px; height: 24px; border: none; background: transparent; border-radius: 8px; color: #1e3a6e; font-size: calc(18px * var(--k)); line-height: 1; cursor: pointer; }
  .dp-nav:hover { background: #f1f5f9; }
  .dp-my { display: inline-flex; overflow: hidden; border-radius: 8px; border: 1px solid #e5e7eb; }
  .dp-my button { display: flex; align-items: center; gap: 4px; border: none; background: #fff; padding: 5px 8px; font-size: calc(12px * var(--k)); font-weight: 700; color: #1e3a6e; cursor: pointer; }
  .dp-my button.m { color: #1d4ed8; }
  .dp-my button + button { border-left: 1px solid #e5e7eb; }
  .dp-days { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 5px; text-align: center; }
  .dp-wd { padding-bottom: 2px; font-size: max(10px, calc(10.5px * var(--k))); font-weight: 600; color: #6b7280; }
  .dp-day { justify-self: center; width: 28px; height: 28px; border: none; background: transparent; border-radius: 8px; font-size: calc(12px * var(--k)); font-weight: 600; color: #111827; cursor: pointer; font-variant-numeric: tabular-nums; }
  .dp-day:hover { background: #f1f5f9; }
  .dp-day.out { color: #cbd5e1; }
  .dp-day.today { color: #0d4fd6; font-weight: 700; box-shadow: inset 0 0 0 1px #3b82f6; }
  .dp-day.sel, .dp-tile.on, .dp-my button.on { background: var(--sweep); color: #fff; box-shadow: var(--sel-shadow); }
  .dp-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dp-tile { border: none; padding: 8px 0; border-radius: 8px; background: #f8fafc; font-size: calc(12px * var(--k)); font-weight: 600; color: #1e3a6e; cursor: pointer; }
  .dp-tile:hover { background: #f1f5f9; }

  footer { flex: none; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding: calc(var(--gap) - 4px) var(--pad) var(--pad); }
  .primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--btn); min-width: 112px; padding: 0 22px; border: none; border-radius: 10px;
    background: var(--sweep); color: #fff; font-size: calc(13.5px * var(--k)); font-weight: 700; box-shadow: var(--btn-shadow); cursor: pointer; }
  footer .soft { height: var(--btn); min-width: 112px; font-size: calc(13.5px * var(--k)); }

  /* Portrait tablets (content under ~900px): one column (Account Information, Payment Alert, Currency), scrolling inside the modal. */
  @media (max-width: 963px) {
    .body { display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .col { display: contents; }
    .card, .card.info, .card.cur, .card.alert { flex: none; min-height: 0; overflow: visible; }
    .card-b { overflow: visible; }
    .card.info { order: 1; } .card.alert { order: 2; } .card.cur { order: 3; }
  }
  /* ---- Smaller Payment Alert (options A / B) ---- */
  /* One thin segmented bar instead of four big buttons. */
  .pseg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 10px; background: rgba(255,255,255,.45); border: 1px solid var(--off-line); }
  .pseg b { height: calc(var(--in) - 10px); display: flex; align-items: center; justify-content: center; gap: 3px; border-radius: 7px; font-size: calc(12px * var(--k)); font-weight: 700; color: #64748b; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .pseg b:hover { color: var(--navy); background: rgba(255,255,255,.6); }
  .pseg b.on { background: var(--sweep); color: #fff; box-shadow: var(--sel-shadow); }
  /* Small day grid: 31 numbers, 7 per row, fixed-size cells (they don't stretch with the card). */
  /* Custom day grid: boxed like a field group; the cells stretch to fill the row so the box has no ragged right edge. */
  .mgrid-wrap { margin-top: 6px; padding: 6px 8px 8px; border-radius: 12px; border: 1px dashed var(--off-line); background: rgba(255,255,255,.3); }
  .mgrid-h { margin: 0 0 4px 1px; font-size: calc(12px * var(--k)); font-weight: 700; color: #475569; }
  /* "Alert Type *" on the same line as its bar (saves a row). */
  .trow { display: flex; align-items: center; gap: 10px; }
  .trow .l { flex: none; margin: 0; font-size: var(--lbl); font-weight: 600; color: #374151; white-space: nowrap; }
  .trow .l i { font-style: normal; color: var(--red); }
  .trow .pseg { flex: 1; min-width: 0; }
  /* 11 per row = 3 rows for 1-31 (instead of 5 rows of 7). */
  /* Fixed 30px cells that fill the row: 2 rows for 1-31 when the column is wide enough, 3 otherwise. */
  .mdays { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--mday-w), 1fr)); gap: 4px; }
  .mdays b { height: var(--mday); display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--off-line); background: var(--off); font-size: calc(12.5px * var(--k)); font-weight: 600; color: #475569; cursor: pointer; }
  .mdays b:hover { border-color: #93c5fd; background: rgba(255,255,255,.85); }
  .mdays b.on { border-color: #3b82f6; background: var(--stripe); color: #0d4fd6; font-weight: 800; box-shadow: inset 0 0 0 1px #3b82f6; }
  /* Short screens: Custom grid | Start Date, Amount, summary side by side */
  .side { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 10px; margin-top: 4px; align-items: start; }
  .side .mgrid-wrap { margin-top: 0; padding: 5px 8px 7px; }
  .side .mdays { grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; }
  .side .mdays b { height: calc(var(--mday) - 2px); }
  .side-r { display: flex; flex-direction: column; gap: calc(min(var(--fg), 8px) - 2px); }
  .side-r .sline { margin-top: 0; }
  /* Shorter Start Date / Amount boxes here, and fixed line heights so other system fonts (Segoe UI etc.) can't add height. */
  .side-r .in { height: calc(var(--in) - 4px); }
  .side-r .f .l, .side .mgrid-h { line-height: 15px; }
  .side-r .sline { line-height: 16px; }
  /* Very short screens (1280 x 560): a bit more room so other fonts never tip it into scrolling. */
  @media (max-height: 600px) {
    .side-r .in { height: calc(var(--in) - 5px); }
    .side-r { gap: 4px; }
    .side .mgrid-wrap { padding: 4px 8px 6px; }
    .side .mgrid-h { margin-bottom: 3px; }
    .side .mdays b { height: calc(var(--mday) - 3px); }
    .side-r .sline { padding-top: 1px; padding-bottom: 1px; }
  }
  /* Custom popup (option B) */
  .cu-pop { padding: 10px 12px 12px; }
  .cu-pop .cu-h { font-size: calc(12px * var(--k)); font-weight: 700; color: #475569; margin-bottom: 6px; }
  .cu-pop .mdays { grid-template-columns: repeat(7, 1fr); }
  .cu-pop .mdays b { height: 30px; background: #f8fafc; border-color: #e5e7eb; }
  /* One-line summary: no box, small date chips. */
  /* Reminder summary: a light blue strip led by a solid blue bell badge, so it reads as "this is when you'll be reminded". */
  .card.alert { container-type: inline-size; }
  .card.alert .card-b { padding-bottom: calc(var(--cp) - 4px); }
  .sline { margin-top: min(var(--fg), 9px); padding: 2px 10px 2px 3px; border-radius: 10px; background: var(--stripe); border: 1px solid #bfd8ff;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: calc(12.5px * var(--k)); color: #475569; }
  .sline .bell { flex: none; width: var(--bell); height: var(--bell); border-radius: 99px; display: grid; place-items: center;
    background: var(--sweep); color: #fff; box-shadow: var(--sel-shadow); }
  /* Narrow card: 3 upcoming dates instead of 4 so the strip stays on one line. */
  @container (max-width: 440px) { .sline .dots span:nth-child(4) { display: none; } }
  .sline .bell svg { width: calc(var(--bell) - 10px); height: calc(var(--bell) - 10px); }
  .sline b { color: var(--navy); font-weight: 700; }
  .sline .dots { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .sline .dots span { height: 18px; padding: 0 5px; border-radius: 6px; background: rgba(255,255,255,.7); border: 1px solid rgba(130,155,195,.25); font-size: max(10px, calc(10.5px * var(--k))); font-weight: 700; color: #334155; display: inline-flex; align-items: center; }
  .sline .dots span.adj { background: #fff7e6; color: #92560a; }
  .sline .dots i { font-style: normal; color: #8a96a8; }

  /* mockup controls (not part of the design) */
  .demo { position: fixed; left: 12px; bottom: 12px; z-index: 200; display: flex; gap: 6px; background: #0f172a; padding: 6px; border-radius: 10px; }
  .demo button { border: none; border-radius: 7px; padding: 5px 9px; background: #334155; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  .demo button.on { background: #3b82f6; }
  body.embed .demo { display: none; }
</style>

<body>

  <main class="main">

        </header>
        <div class="body" id="body"></div>
        <footer>
          <button class="soft">Cancel</button>
          <button class="primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>Save</button>
        </footer>
      </section>
    </div>
  </main>
  <div class="demo" id="demo"></div>

<script>
  const CHECK = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4"><path d="M20 6 9 17l-5-5"/></svg>';
  const X = '<svg class="x" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const XS = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const BELL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
  const INFO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  const CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>';
  const CHEV13 = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>';
  const EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const CAL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>';
  const SEARCH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const PLUS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>';
  const TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  const ICON_ADD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>';
  const ICON_EDIT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11.5 15H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21.4 16.6a2 2 0 0 0-3-3L14 18v3h3z"/></svg>';
  const COMPANIES = [["C168","Count 168"],["GP","GP Holdings"],["IG","IG Group"],["95ASIA","95 Asia"],["ALPHA","Alpha Trading"],["BETA","Beta Ventures"],["DELTA","Delta Resources"],["OMEGA","Omega Capital"],["KING","King Enterprise"],["LUCKY","Lucky Star"],["NOVA","Nova Partners"],["ORBIT","Orbit Media"],["PRIME","Prime Holdings"],["SUMMIT","Summit Group"]];
  const PRESETS = [7, 15];
  const PICKS = [[7, "Weekly", "every 7 days"], [15, "15 Days", "every 15 days"], ["monthly", "Monthly", "same date"], ["custom", "Custom", "1 – 31 days"]];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const WEEK = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // URL hash lets the size preview open a given state: #embed, #edit, #custom, #company, #date, #delete
  const H = location.hash + " " + (window.name || "");
  const S = {
    pa: "compact", cuOpen: false, tight: false, swap: true,
    mode: H.includes("edit") ? "edit" : "add", alertOn: true,
    pv: H.includes("custom") ? 30 : 7, pcustom: H.includes("custom"), start: "2026-10-01",
    del: H.includes("delete"), coQ: "", pop: H.includes("company"), dpOpen: H.includes("date"), dpView: "day", dpY: 2026, dpM: 9,
    curs: ["MYR","SGD","USD","THB","IDR","VND","PHP","CNY","HKD","USDT"], curOn: new Set(["MYR"]), coOn: new Set(["C168"]),
  };
  if (S.mode === "edit") { S.curOn = new Set(["MYR","SGD","USD"]); S.coOn = new Set(["C168","GP"]); }
  if (H.includes("embed")) document.body.classList.add("embed");
  const $ = (id) => document.getElementById(id);
  $("rows").innerHTML = Array.from({ length: 30 }, () => '<div class="fake-row"></div>').join("");
  const edit = () => S.mode === "edit";
  const WIDE = 1440;   // >= 1440px wide: Company gets its own box (3 columns); below that it is a dropdown field
  const wide = () => innerWidth >= (window.WIDE_MIN || WIDE);

  /* ---- date helpers ---- */
  const pDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmt = (d) => d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
  const ord = (n) => n + (n % 10 === 1 &amp;&amp; n !== 11 ? "st" : n % 10 === 2 &amp;&amp; n !== 12 ? "nd" : n % 10 === 3 &amp;&amp; n !== 13 ? "rd" : "th");
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };

  /* ---- Account Information ---- */
  function info() {
    const e = edit();
    const toks = COMPANIES.filter(([c]) => S.coOn.has(c)).map(([c]) => `<span class="tok">${c}<span class="rm" data-act="co" data-v="${c}">${XS}</span></span>`).join("") || '<span class="ph">Choose companies</span>';
    return `<section class="card info"><div class="card-h"><span class="bar"></span><h2>Account Information</h2></div><div class="card-b">
      <div class="grid2">
        <div class="f"><span class="l">Account ID <i>*</i></span><div class="in">${e ? "BKA1" : ""}</div></div>
        <div class="f"><span class="l">Name <i>*</i></span><div class="in">${e ? "BANK ALPHA" : ""}</div></div>
        <div class="f"><span class="l">Role <i>*</i></span><div class="in ${e ? "" : "ph"}"><span class="grow">${e ? "BANK" : "Select Role"}</span>${CHEV}</div></div>
        <div class="f"><span class="l">Password ${e ? "<em>(opt.)</em>" : "<i>*</i>"}</span><div class="in ${e ? "ph" : ""}"><span class="grow">${e ? "Keep current" : ""}</span>${EYE}</div></div>
        <div class="f full remark"><span class="l">Remark <em>(opt.)</em></span><div class="in">${e ? "Main settlement account" : ""}</div>
          </div>
        ${wide() ? "" : `<div class="f full"><span class="l">Company <i>*</i></span>
          <div class="in multi ${S.pop ? "open" : ""}" data-act="pop" id="coField">${toks}<span class="meta">${S.coOn.size}/${COMPANIES.length}${CHEV}</span></div></div>`}
      </div></div></section>`;
  }
  // Large screens only: Company as its own box with the list always visible (same rows as the dropdown).
  const companyCard = () => `<section class="card co"><div class="card-h"><span class="bar"></span><h2>Company <i style="font-style:normal;color:var(--red)">*</i></h2><span class="r"><span class="count">${S.coOn.size}/${COMPANIES.length} selected</span></span></div>
      <div class="co-tools"><label class="mini-search">${SEARCH}<input data-search placeholder="Search company" value="${S.coQ}"></label>
        <button type="button" class="lnk" data-act="coall">Select all</button><button type="button" class="lnk mute" data-act="coclear">Clear</button></div>
      <div class="opts" data-bind="opts">${coOpts()}</div></section>`;
  const coList = () => { const q = S.coQ.toLowerCase(); return COMPANIES.filter(([c, n]) => !q || `${c} ${n}`.toLowerCase().includes(q)); };
  const coOpts = () => coList().map(([c, n]) => `<div class="opt ${S.coOn.has(c) ? "on" : ""}" data-act="co" data-v="${c}"><span class="box">${S.coOn.has(c) ? CHECK : ""}</span><b>${c}</b><span class="nm">${n}</span>${c === "C168" ? '<span class="tag">CURRENT</span>' : ""}</div>`).join("")
    || '<div class="opt-empty">No company found</div>';
  const companyPop = () => `<div class="portal pop" data-anchor="coField" data-minw="300" data-maxh="380">
      <div class="pop-h"><label class="mini-search">${SEARCH}<input data-search placeholder="Search" value="${S.coQ}"></label>
        <button type="button" class="lnk" data-act="coall">Select all</button><button type="button" class="lnk mute" data-act="coclear">Clear</button></div>
      <div class="opts" data-bind="opts">${coOpts()}</div>
      <div class="pop-f"><span><b>${S.coOn.size}</b> of ${COMPANIES.length} selected</span><button type="button" class="done" data-act="codone">Done</button></div></div>`;

  /* ---- Currency ---- */
  function currency() {
    const tiles = S.curs.map((c) => `<div class="ctile ${S.curOn.has(c) ? "on" : ""}" data-act="cur" data-v="${c}">${c}<span class="k">${S.curOn.has(c) ? CHECK : ""}</span>${X}</div>`).join("");
    return `<section class="card cur"><div class="card-h"><span class="bar"></span><h2>Currency</h2><span class="r"><span class="count">${S.curOn.size} selected</span></span></div><div class="card-b">
      <div class="cur-tools"><input class="in" id="newCur" aria-label="New currency code" />
        <button class="btn blue" data-act="create">${PLUS}Create</button>
        <button class="btn del ${S.del ? "on" : ""}" data-act="del">${TRASH}${S.del ? "Done" : "Delete"}</button></div>
      <div class="ctiles ${S.del ? "deleting" : ""}">${tiles}</div>
      ${S.del ? '<p class="del-hint">Click × to delete an unticked currency. Ticked currencies can\'t be deleted.</p>' : ""}
    </div></section>`;
  }

  /* ---- Payment Alert ---- */
  const popMode = () => S.pa === "popup";
  const isCustom = () => S.pcustom || (typeof S.pv === "number" &amp;&amp; !PRESETS.includes(S.pv));
  const label = (v) => v === "monthly" ? `Monthly, on the ${ord(pDate(S.start).getDate())}` : v === 1 ? "Every day" : v === 7 ? "Every week" : v % 7 === 0 ? `Every ${v / 7} weeks` : `Every ${v} days`;
  function nextDates(v, n = 5) {
    const start = pDate(S.start), out = [];
    for (let i = 0; i < n; i++) {
      if (v === "monthly") {
        const last = new Date(start.getFullYear(), start.getMonth() + i + 1, 0).getDate();
        const day = Math.min(start.getDate(), last);
        out.push({ t: fmt(new Date(start.getFullYear(), start.getMonth() + i, day)), adj: day !== start.getDate() });
      } else out.push({ t: fmt(addDays(start, v * i)), adj: false });
    }
    return out;
  }
  function alert() {
    const sw = `<span class="switch ${S.alertOn ? "on" : ""}" data-act="alert"><span class="track"></span>${S.alertOn ? "On" : "Off"}</span>`;
    let body;
    if (!S.alertOn) body = '<div class="off-state">Payment alert is off.<br>Switch it on to set how often to remind, from when, and the amount.</div>';
    else {
      const custom = isCustom(), start = pDate(S.start);
      const picks = `<div class="picks">${PICKS.map(([pv, t, sub]) => {
        const on = pv === "custom" ? custom : (!custom &amp;&amp; S.pv === pv);
        const s = pv === "custom" &amp;&amp; custom ? `every ${S.pv} day${S.pv === 1 ? "" : "s"}` : sub;
        return `<div class="pick ${on ? "on" : ""}" data-act="pick" data-v="${pv}"><b>${t}</b></div>`; }).join("")}</div>`;
      const grid = !custom ? "" : `<div class="pcustom"><div class="pcustom-h">Remind every … days</div>
        <div class="pdays">${[0, 1, 2, 3, 4].map((r) => Array.from({ length: 7 }, (_, c) => { const n = r * 7 + c + 1;
          return n > 31 ? '<b class="gap"></b>' : `<b data-act="pday" data-v="${n}" class="${S.pv === n ? "on" : ""}">${n}</b>`; }).join("")
          + `<span class="wk">${r < 4 ? `${r + 1} week${r ? "s" : ""}` : ""}</span>`).join("")}</div>
        </div>`;
      const dates = nextDates(S.pv).map((d) => `<span class="${d.adj ? "adj" : ""}">${d.t}</span>`).join("");
      if (S.pa !== "current") body = alertCompact(custom, start);
      else body = `<div class="alert-in"><div class="f"><span class="l">Alert Type <i>*</i></span>${picks}${grid}</div>
        <div class="grid2" style="margin-top:var(--fg)">
          <div class="f"><span class="l">Start Date <i>*</i></span><div class="in dp-in ${S.dpOpen ? "open" : ""}" data-act="dp" id="dpField"><span class="grow">${S.start}</span>${CAL}</div></div>
          <div class="f"><span class="l">Alert (Amount) <em>(opt.)</em></span><div class="in">-5,000.00</div></div>
        </div>
        <div class="summary"><div class="top">${BELL}${label(S.pv)}, from ${fmt(start)} ${start.getFullYear()}</div>
          <div class="pdates">${dates}<span style="background:none;color:#8a96a8">…</span></div></div></div>`;
    }
    return `<section class="card alert"><div class="card-h"><span class="bar"></span><h2>Payment Alert</h2><span class="r">${sw}</span></div><div class="card-b">${body}</div></section>`;
  }
  /* ---- Smaller Payment Alert options ----
     A "compact": one thin segmented bar, a small 7-column day grid (no week labels), a one-line summary.
     B "popup":   the same, but the day grid opens in a popup under Custom, so the card never grows. */
  const segBar = (custom) => `<div class="pseg">${PICKS.map(([pv, t]) => {
      const on = pv === "custom" ? custom : (!custom &amp;&amp; S.pv === pv);
            const caret = pv === "custom" &amp;&amp; popMode() ? CHEV13 : "";
      return `<b data-act="${pv === "custom" &amp;&amp; popMode() ? "cpop" : "pick"}" data-v="${pv}" class="${on ? "on" : ""}" ${pv === "custom" ? 'id="cuField"' : ""}>${t}${caret}</b>`;
    }).join("")}</div>`;
  const miniGrid = () => `<div class="mdays">${Array.from({ length: 31 }, (_, i) => {
      const n = i + 1;
      return `<b data-act="pday" data-v="${n}" class="${S.pv === n ? "on" : ""}">${n}</b>`;
    }).join("")}</div>`;
  function alertCompact(custom, start) {
    if (custom &amp;&amp; S.tight) return alertSide();
    const dates = nextDates(S.pv, 4).map((d) => `<span class="${d.adj ? "adj" : ""}">${d.t}</span>`).join("");
    const grid = custom &amp;&amp; !popMode() ? `<div class="mgrid-wrap"><div class="mgrid-h">Remind every … days</div>${miniGrid()}</div>` : "";
    return `<div class="trow"><span class="l">Alert Type <i>*</i></span>${segBar(custom)}</div>${grid}
      <div class="grid2" style="margin-top:var(--fg)">
        <div class="f"><span class="l">Start Date <i>*</i></span><div class="in dp-in ${S.dpOpen ? "open" : ""}" data-act="dp" id="dpField"><span class="grow">${S.start}</span>${CAL}</div></div>
        <div class="f"><span class="l">Alert (Amount) <em>(opt.)</em></span><div class="in">-5,000.00</div></div>
      </div>
      <div class="sline"><span class="bell">${BELL}</span><b>${label(S.pv)}</b><span class="dots">${dates}<i>…</i></span></div>`;
  }
  // Short screens (the stacked Custom grid would make Payment Alert scroll): day grid on the left,
  // Start Date / Amount / summary stacked on the right. The grid takes as many columns as fit (9 at 1366, 6 at 1600).
  function alertSide() {
    const dates = nextDates(S.pv, 2).map((d) => `<span class="${d.adj ? "adj" : ""}">${d.t}</span>`).join("");
    return `<div class="trow"><span class="l">Alert Type <i>*</i></span>${segBar(true)}</div>
      <div class="side"><div class="mgrid-wrap"><div class="mgrid-h">Remind every … days</div>${miniGrid()}</div>
        <div class="side-r">
          <div class="f"><span class="l">Start Date <i>*</i></span><div class="in dp-in ${S.dpOpen ? "open" : ""}" data-act="dp" id="dpField"><span class="grow">${S.start}</span>${CAL}</div></div>
          <div class="f"><span class="l">Alert (Amount) <em>(opt.)</em></span><div class="in">-5,000.00</div></div>
          <div class="sline"><span class="bell">${BELL}</span><b>${label(S.pv)}</b><span class="dots">${dates}<i>…</i></span></div>
        </div></div>`;
  }
  const customPop = () => `<div class="portal cu-pop" data-anchor="cuField" data-minw="292"><div class="cu-h">Remind every … days</div>${miniGrid()}</div>`;

  function datePop() {
    const vy = S.dpY, vm = S.dpM, todayIso = iso(today());
    let body;
    if (S.dpView === "day") {
      const first = new Date(vy, vm, 1), cells = Math.ceil((first.getDay() + new Date(vy, vm + 1, 0).getDate()) / 7) * 7, st = addDays(first, -first.getDay());
      body = `<div class="dp-days">${WEEK.map((w) => `<span class="dp-wd">${w}</span>`).join("")}${Array.from({ length: cells }, (_, i) => {
        const dt = addDays(st, i), v = iso(dt);
        const cls = v === S.start ? "sel" : dt.getMonth() !== vm ? "out" : v === todayIso ? "today" : "";
        return `<button type="button" class="dp-day ${cls}" data-act="dpset" data-v="${v}">${dt.getDate()}</button>`; }).join("")}</div>`;
    } else if (S.dpView === "month") {
      body = `<div class="dp-tiles">${MONTHS.map((l, i) => `<button type="button" class="dp-tile ${i === vm ? "on" : ""}" data-act="dpmonth" data-v="${i}">${l}</button>`).join("")}</div>`;
    } else {
      const p = Math.floor(vy / 12) * 12;
      body = `<div class="dp-tiles">${Array.from({ length: 12 }, (_, i) => p + i).map((y) => `<button type="button" class="dp-tile ${y === vy ? "on" : ""}" data-act="dpyear" data-v="${y}">${y}</button>`).join("")}</div>`;
    }
    return `<div class="portal dp-pop" data-anchor="dpField" data-minw="260">
      <div class="dp-head"><button type="button" class="dp-nav" data-act="dpstep" data-v="-1">‹</button>
        <div class="dp-my"><button type="button" class="${S.dpView === "month" ? "on" : "m"}" data-act="dpview" data-v="month">${MONTHS[vm]} ${CHEV13}</button><button type="button" class="${S.dpView === "year" ? "on" : ""}" data-act="dpview" data-v="year">${vy} ${CHEV13}</button></div>
        <button type="button" class="dp-nav" data-act="dpstep" data-v="1">›</button></div>${body}</div>`;
  }

  /* ---- popups: placed under their field, flipped above when there's no room, height capped to the screen ---- */
  function placePopups() {
    document.querySelectorAll(".portal").forEach((p) => {
      const a = $(p.dataset.anchor);
      if (!a) { p.remove(); return; }
      const r = a.getBoundingClientRect(), gap = 6, edge = 8;
      const w = Math.max(r.width, +p.dataset.minw || 0);
      p.style.width = w + "px";
      p.style.left = Math.max(edge, Math.min(r.left, innerWidth - w - edge)) + "px";
      p.style.maxHeight = "none";
      const natural = p.scrollHeight;
      const below = innerHeight - r.bottom - gap - edge, above = r.top - gap - edge;
      const up = natural > below &amp;&amp; above > below;
      const room = Math.min(up ? above : below, +p.dataset.maxh || Infinity);
      const h = Math.min(natural, room);
      p.style.maxHeight = room + "px";
      p.style.top = (up ? r.top - gap - h : r.bottom + gap) + "px";
    });
  }

  function render() {
    $("title").textContent = edit() ? "Edit Account" : "Add Account";
    $("hicon").innerHTML = edit() ? ICON_EDIT : ICON_ADD;
    const w = wide();
    $("body").className = "body" + (w ? " wide" : "") + (S.swap ? " swap" : "");
    // swap: Payment Alert under Account Information, Currency gets the second column.
    const left = S.swap ? info() + alert() : info() + currency();
    const right = S.swap ? currency() : alert();
    S.tight = false;
    $("body").innerHTML = `<div class="col">${left}</div><div class="col">${right}</div>${w ? `<div class="col">${companyCard()}</div>` : ""}`;
    // Option A: try the Custom grid stacked first; if Payment Alert would have to scroll, switch to the side-by-side layout.
    if (S.pa === "compact" &amp;&amp; S.alertOn &amp;&amp; isCustom()) {
      const b = document.querySelector(".card.alert .card-b");
      if (b.scrollHeight > b.clientHeight + 1) { S.tight = true; document.querySelector(".card.alert").outerHTML = alert(); }
    }
    if (w) S.pop = false;
    document.querySelectorAll(".portal").forEach((p) => p.remove());
    if (S.pop) document.body.insertAdjacentHTML("beforeend", companyPop());
    if (S.dpOpen &amp;&amp; S.alertOn) document.body.insertAdjacentHTML("beforeend", datePop());
    if (S.cuOpen &amp;&amp; S.alertOn &amp;&amp; popMode()) document.body.insertAdjacentHTML("beforeend", customPop());
    placePopups();
    $("demo").innerHTML = [["current", "Current"], ["compact", "A · Compact"], ["popup", "B · Popup"]].map(([k, l]) => `<button data-act="pa" data-v="${k}" class="${S.pa === k ? "on" : ""}">${l}</button>`).join("") + `<i style="width:8px;display:inline-block"></i><button data-act="swap" class="${S.swap ? "on" : ""}">Swap: Alert under Info</button><i style="width:8px;display:inline-block"></i>` + `<button data-act="mode" data-v="add" class="${S.mode === "add" ? "on" : ""}">Add</button><button data-act="mode" data-v="edit" class="${S.mode === "edit" ? "on" : ""}">Edit</button>`;
  }

  // Re-render on resize: the Company field/box breakpoint and the inline/popup Custom grid both depend on the size.
  addEventListener("resize", render);
  // A popup belongs to its field: if the card under it scrolls, close it instead of leaving it floating.
  document.addEventListener("scroll", (e) => {
    if (e.target.closest &amp;&amp; e.target.closest(".portal")) return;
    if (S.pop || S.dpOpen || S.cuOpen) { S.pop = S.dpOpen = S.cuOpen = false; render(); }
  }, true);
  document.addEventListener("input", (e) => {
    if (!e.target.matches("[data-search]")) return;
    S.coQ = e.target.value;
    document.querySelector('[data-bind="opts"]').innerHTML = coOpts();
    placePopups();
  });
  document.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-search]")) return;
    const el = ev.target.closest("[data-act]");
    if (!el) {
      if ((S.pop || S.dpOpen || S.cuOpen) &amp;&amp; !ev.target.closest(".portal")) { S.pop = S.dpOpen = S.cuOpen = false; render(); }
      return;
    }
    const act = el.dataset.act, v = el.dataset.v;
    if (S.dpOpen &amp;&amp; !act.startsWith("dp")) S.dpOpen = false;
    if (S.cuOpen &amp;&amp; !["cpop", "pday"].includes(act)) S.cuOpen = false;
    if (S.pop &amp;&amp; !["co", "coall", "coclear", "pop"].includes(act)) S.pop = false;
    switch (act) {
      case "mode": S.mode = v; S.curOn = new Set(v === "edit" ? ["MYR","SGD","USD"] : ["MYR"]); S.coOn = new Set(v === "edit" ? ["C168","GP"] : ["C168"]); break;
      case "alert": S.alertOn = !S.alertOn; break;
      case "pick": if (v === "custom") { S.pcustom = true; if (typeof S.pv !== "number") S.pv = 30; } else { S.pv = v === "monthly" ? "monthly" : +v; S.pcustom = false; } break;
      case "pday": S.pv = +v; S.pcustom = true; S.cuOpen = false; break;
      case "cpop": S.cuOpen = !S.cuOpen; S.pcustom = true; if (typeof S.pv !== "number") S.pv = 30; break;
      case "pa": S.pa = v; S.cuOpen = false; break;
      case "swap": S.swap = !S.swap; break;
      case "dp": S.dpOpen = !S.dpOpen; { const d = pDate(S.start); S.dpY = d.getFullYear(); S.dpM = d.getMonth(); S.dpView = "day"; } break;
      case "dpset": S.start = v; S.dpOpen = false; break;
      case "dpview": S.dpView = S.dpView === v ? "day" : v; break;
      case "dpmonth": S.dpM = +v; S.dpView = "day"; break;
      case "dpyear": S.dpY = +v; S.dpView = "month"; break;
      case "dpstep": { const n = +v;
        if (S.dpView === "day") { const d = new Date(S.dpY, S.dpM + n, 1); S.dpY = d.getFullYear(); S.dpM = d.getMonth(); }
        else S.dpY += S.dpView === "month" ? n : n * 12; break; }
      case "del": S.del = !S.del; break;
      case "create": { const c = ($("newCur").value || "").trim().toUpperCase(); if (c &amp;&amp; !S.curs.includes(c)) { S.curs.push(c); S.curOn.add(c); } break; }
      case "cur": if (S.del) { if (!S.curOn.has(v)) S.curs = S.curs.filter((x) => x !== v); } else S.curOn.has(v) ? S.curOn.delete(v) : S.curOn.add(v); break;
      case "co": S.coOn.has(v) ? S.coOn.delete(v) : S.coOn.add(v); break;
      case "pop": S.pop = !S.pop; break;
      case "coall": coList().forEach(([c]) => S.coOn.add(c)); break;
      case "coclear": S.coOn.clear(); break;
      case "codone": S.pop = false; S.coQ = ""; break;
      default: return;
    }
    render();
  });
  render();
</script>
</body>

</textarea>
<script>
  const SIZES = [[1280, 560, "1366 laptop (small)"], [1366, 610, "1366 laptop"], [1536, 730, "1920 @125%"], [1440, 760, "Common monitor"], [1600, 800, "Common monitor"], [1920, 950, "Large"], [1180, 820, "Tablet landscape"], [1024, 768, "Tablet landscape"], [820, 1180, "Tablet portrait"], [768, 1024, "Tablet portrait"]];
  const STATES = [["", "Add · Weekly"], ["custom", "Custom open (tallest)"], ["edit custom", "Edit · Custom"], ["company", "Company dropdown (1280 / 1366)"], ["custom date", "Date picker"], ["delete", "Currency delete"]];
  const src = document.getElementById("src").value;
  let size = 0, state = "custom";
  function build() {
    document.getElementById("tabs").innerHTML = SIZES.map(([w, h, n], i) => `<button data-i="${i}" class="${i === size ? "on" : ""}"><b>${w} × ${h}</b><span>${n}</span></button>`).join("");
    document.getElementById("bar").innerHTML = "State:" + STATES.map(([k, l]) => `<button data-s="${k}" class="${k === state ? "on" : ""}">${l}</button>`).join("");
    const [w, h] = SIZES[size];
    const grid = document.getElementById("grid");
    grid.innerHTML = `<div class="frame" data-w="${w}" data-h="${h}"><iframe name="embed ${state}" width="${w}" height="${h}"></iframe></div>`;
    grid.querySelector("iframe").srcdoc = src;
    fit();
  }
  // Scale the frame so the whole screen fits both the width and the height left in this window.
  function fit() {
    const fr = document.querySelector(".frame");
    if (!fr) return;
    const w = +fr.dataset.w, h = +fr.dataset.h;
    const availW = document.getElementById("grid").clientWidth;
    const availH = innerHeight - fr.getBoundingClientRect().top - 24;
    const s = Math.min(1, availW / w, Math.max(0.3, availH / h));
    fr.style.width = w * s + "px";
    fr.style.height = h * s + "px";
    fr.querySelector("iframe").style.transform = `scale(${s})`;
  }
  document.getElementById("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) { size = +b.dataset.i; build(); } });
  document.getElementById("bar").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) { state = b.dataset.s; build(); } });
  addEventListener("resize", fit);
  build();
</script>
</body>
