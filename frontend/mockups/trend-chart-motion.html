<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Chart Living Line Options</title>
<style>
  :root{--ink:#111827;--sub:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font-family:'Geist','Inter',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(200deg,#eaf3fd 0%,#cfe3fb 55%,#bcd8f7 100%);min-height:100vh}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{margin:0;font-size:18px}
  header p{margin:4px 0 0;font-size:12.5px;color:var(--sub);max-width:640px;line-height:1.5}
  .ctl{display:flex;gap:8px;flex-wrap:wrap}
  .ctl button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#1f2937}
  .ctl button.primary{background:linear-gradient(180deg,#63c4ff 0%,#0d60ff 100%);color:#fff;border-color:transparent}
  .ctl button:hover{filter:brightness(.97)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  @media(max-width:1100px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid rgba(226,232,240,.95);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .card h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .tag{font-size:11px;font-weight:700;color:#1d4ed8;background:#e8f0fe;border-radius:6px;padding:2px 7px}
  .card p{margin:4px 0 10px;font-size:12.5px;color:var(--sub);line-height:1.5}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11.5px;color:var(--sub)}
  svg{display:block;width:100%;height:auto}
  .axis{font-size:10px;fill:#94a3b8}
  .grid-line{stroke:#eef0f3;stroke-dasharray:4 4}
  .zero{stroke:#e2e8f0}
  path.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <div>
    <h1>Trend Chart · 轻柔的加载动画</h1>
    <p>只做两件事，加载完线条就保持静止：<b>数据加载出来</b>时线条平滑出现；<b>切换筛选</b>时线条平滑地变到新数据（约 0.6 秒）。下面 3 种是"出现"的方式，都很克制。</p>
  </div>
  <div class="ctl">
    <button class="primary" id="reload">重新加载数据</button>
    <button id="switch">切换筛选（换一份数据）</button>
    <button id="pause">暂停</button>
  </div>
</header>
<div class="grid" id="grid"></div>

<script>
const W = 1000, H = 330, L = 64, R = 990, T = 16, B = 300, LO = -7500, HI = 2500, N = 30;
const NET = '#10b981', EARN = '#f59e0b';
const x = (i) => L + (i / (N - 1)) * (R - L);
const y = (v) => T + (1 - (v - LO) / (HI - LO)) * (B - T);
const g = (i, c, a, s) => a * Math.exp(-((i - c) ** 2) / (2 * s * s));
const clamp = (v) => Math.min(1, Math.max(0, v));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

// two datasets so "switch filter" has something to morph between
const DATA = [
  Array.from({ length: N }, (_, i) => g(i, 0, 1650, 0.9) + g(i, 3, -6136, 0.75) + g(i, 24, 1680, 0.8)),
  Array.from({ length: N }, (_, i) => g(i, 7, 2100, 1.3) + g(i, 14, -3800, 1.1) + g(i, 21, 900, 1.0) + g(i, 27, 1900, 0.9)),
];
const series = (k) => ({ net: DATA[k], earn: DATA[k].map((v) => v * 0.3) });

function monotone(pts) {
  const n = pts.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i+1][0] - pts[i][0]; m[i] = (pts[i+1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : 3 * (dx[i-1] + dx[i]) / ((2*dx[i] + dx[i-1]) / m[i-1] + (dx[i] + 2*dx[i-1]) / m[i]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += ` C${pts[i][0]+h},${pts[i][1]+t[i]*h} ${pts[i+1][0]-h},${pts[i+1][1]-t[i+1]*h} ${pts[i+1][0]},${pts[i+1][1]}`; }
  return d;
}

/* Each option: how the line is drawn once it has its data.
   rise/stagger control the "grow in from 0" load animation; ripple(i, t, lag) is extra vertical
   movement in px (negative = up) that keeps the line alive after loading. */
const OPTIONS = [
  {
    tag: '推荐', title: '方案 1 · 从左到右画出来',
    desc: '加载时线条和填充从左到右一路"画"出来（约 1.2 秒），像折线图最常见的进场方式。画完就静止。',
    meta: ['感觉：最自然、最常见', 'recharts 自带（Area 的进场动画就是这个）', '几乎不用写额外代码'],
    wipe: 1.2, stagger: 0, dur: 0.001,
  },
  {
    tag: '推荐', title: '方案 2 · 整体平滑升起',
    desc: '加载时整条线从 0 的位置一起平滑地"长"到真实的数据高度（约 0.8 秒），没有先后，干净利落。',
    meta: ['感觉：安静、稳', 'recharts 自带（数据变化时会自动过渡）', '几乎不用写额外代码'],
    stagger: 0, dur: 0.8,
  },
  {
    tag: '', title: '方案 3 · 依次轻轻升起',
    desc: '和方案 2 类似，但从左到右每个点错开一点点（总共约 0.35 秒），有一点"顺着往右铺开"的感觉，仍然很轻。',
    meta: ['感觉：比方案 2 多一点层次', '需要自己写一个小的动画工具', '幅度和时间都可以再调'],
    stagger: 0.012, dur: 0.7,
  },
]; 

/* ---------------- build the static parts once ---------------- */
const grid = document.getElementById('grid');
grid.innerHTML = OPTIONS.map((o, k) => {
  let s = '';
  for (let v = LO; v <= HI; v += 2500) {
    s += `<line class="${v === 0 ? 'zero' : 'grid-line'}" x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="axis" x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${v.toLocaleString('en-US')}.00</text>`;
  }
  for (let i = 0; i < N; i++) s += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
  return `<div class="card">
    <h2>${o.title}${o.tag ? `<span class="tag">${o.tag}</span>` : ''}</h2>
    <p>${o.desc}</p>
    <svg viewBox="0 0 ${W} ${H}">
      <defs>
        <linearGradient id="fn${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${NET}" stop-opacity=".2"/><stop offset="1" stop-color="${NET}" stop-opacity="0"/></linearGradient>
        <linearGradient id="fe${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${EARN}" stop-opacity=".2"/><stop offset="1" stop-color="${EARN}" stop-opacity="0"/></linearGradient>
      </defs>
      ${s}
      <clipPath id="clip${k}"><rect id="cr${k}" x="0" y="0" width="${W}" height="${H}"/></clipPath><g clip-path="url(#clip${k})"><path id="an${k}" fill="url(#fn${k})"/><path id="ae${k}" fill="url(#fe${k})"/>
      <path id="le${k}" class="ln" stroke="${EARN}" stroke-width="2.2"/>
      <path id="ln${k}" class="ln" stroke="${NET}" stroke-width="2.2"/></g>
    </svg>
    <div class="meta">${o.meta.map((m) => `<span>${m}</span>`).join('')}</div>
  </div>`;
}).join('');

/* ---------------- animation state ---------------- */
let clock = 0, paused = false, dataset = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = OPTIONS.map((o) => ({ stagger: o.stagger, dur: o.dur, t0: 0, from: { net: Array(N).fill(0), earn: Array(N).fill(0) }, to: series(0) }));

function base(k, key, i, now) {
  const o = OPTIONS[k], s = state[k], ease = o.ease || easeOut;
  const p = ease(clamp((now - s.t0 - i * s.stagger) / s.dur));
  return s.from[key][i] + (s.to[key][i] - s.from[key][i]) * p;
}
// how "settled" the line is: the after-load movement fades in once the grow-in has finished
function settle(k, now) {
  const o = OPTIONS[k];
  return clamp((now - state[k].t0 - N * o.stagger - o.dur + 0.3) / 1.0);
}

function draw(now) {
  OPTIONS.forEach((o, k) => {
    const s = 0;
    const w = o.wipe ? easeOut(clamp((now - (state[k].wipeT0 ?? 0)) / o.wipe)) : 1;
    document.getElementById('cr' + k).setAttribute('width', L + (W - L) * w + (w >= 1 ? 20 : 0));
    const build = (key, lag) => {
      const pts = [];
      for (let i = 0; i < N; i++) {
        let v = base(k, key, i, now);
        if (o.scale) v *= o.scale(i, now, lag, s);
        const dy = o.ripple ? o.ripple(i, now, lag, s) : 0;
        pts.push([x(i), y(v) + dy]);
      }
      const d = monotone(pts);
      return [d, `${d} L${x(N - 1)},${y(0)} L${x(0)},${y(0)} Z`];
    };
    const [nd, na] = build('net', 0), [ed, ea] = build('earn', 0.35);   // Earnings trails Net a little
    document.getElementById('ln' + k).setAttribute('d', nd);
    document.getElementById('an' + k).setAttribute('d', na);
    document.getElementById('le' + k).setAttribute('d', ed);
    document.getElementById('ae' + k).setAttribute('d', ea);
  });
}

function reload() {
  OPTIONS.forEach((_, k) => {
    Object.assign(state[k], { stagger: OPTIONS[k].stagger, dur: OPTIONS[k].dur, wipeT0: reduced ? -100 : clock, t0: reduced ? -100 : clock, from: { net: Array(N).fill(0), earn: Array(N).fill(0) }, to: series(dataset) });
  });
}
function switchData() {
  const now = clock;
  dataset = 1 - dataset;
  OPTIONS.forEach((o, k) => {
    // start the morph from whatever is on screen right now
    const shown = { net: [], earn: [] };
    for (let i = 0; i < N; i++) { shown.net.push(base(k, 'net', i, now)); shown.earn.push(base(k, 'earn', i, now)); }
    Object.assign(state[k], { stagger: 0, dur: 0.6, t0: reduced ? -100 : now, from: shown, to: series(dataset) });
  });
}

document.getElementById('reload').onclick = reload;
document.getElementById('switch').onclick = switchData;
document.getElementById('pause').onclick = (e) => { paused = !paused; e.target.textContent = paused ? '继续' : '暂停'; };

let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (!paused && !reduced) clock += dt;
  draw(clock);
  requestAnimationFrame(frame);
}
reload();
requestAnimationFrame(frame);
</script>
</body>
</html>
