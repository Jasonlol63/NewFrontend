name: Deploy backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - name: Add EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,rsa "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Upload jar (staged, then swap)
        run: |
          scp target/Count-0.0.1-SNAPSHOT.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/count168-site/api/Count-0.0.1-SNAPSHOT.jar.new"

      - name: Swap jar and restart service
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            mv /var/www/count168-site/api/Count-0.0.1-SNAPSHOT.jar.new /var/www/count168-site/api/Count-0.0.1-SNAPSHOT.jar
            sudo systemctl restart count168-api
          '

      - name: Wait for service to come back up
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8082/api/settings/getTelegramLink || echo 000)
              if [ "$code" = "200" ]; then echo "backend is up"; exit 0; fi
              sleep 2
            done
            echo "backend did not come back up in time" >&2
            sudo systemctl status count168-api --no-pager || true
            exit 1
          '
